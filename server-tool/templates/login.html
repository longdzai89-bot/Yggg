<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><style>body{margin:0;background:#101318;color:#eee;font-family:system-ui;display:grid;place-items:center;height:100vh}.box{width:min(360px,90vw);background:#181d24;padding:28px;border-radius:18px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #303844;background:#0f1318;color:#fff}button{background:#5b8cff;border:0;font-weight:700}</style></head><body><form class="box" id="f"><h2>🪨 Primitive Realm</h2><p>Admin Panel</p><input id="u" placeholder="Username" value="admin"><input id="p" type="password" placeholder="Password" value="admin123"><button>Đăng nhập</button><small id="e"></small></form><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location='/';else document.querySelector('#e').textContent=(await r.json()).error}</script></body></html>
