<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Primitive Realm Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1116;color:#e8edf2;font-family:system-ui}header{padding:16px 20px;background:#151a21;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}.wrap{padding:18px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#171c23;border:1px solid #262e38;border-radius:14px;padding:15px}.num{font-size:24px;font-weight:800}button,input,select{padding:9px;border-radius:9px;border:1px solid #303844;background:#0f1318;color:#fff}button{cursor:pointer}.danger{background:#8e3030}.ok{background:#2f754d}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #272e37;text-align:left;font-size:13px}.scroll{overflow:auto}.log{font:12px monospace;white-space:pre-wrap;max-height:320px;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}header{position:static}}
</style></head><body><header><b>🪨 Primitive Realm Admin</b><button onclick="logout()">Đăng xuất</button></header><main class="wrap"><div class="grid"><div class="card">Online<div class="num" id="online">0</div></div><div class="card">LAN<div id="lan">-</div></div><div class="card">Public IP<div id="pub">-</div></div><div class="card">Game<div id="game">-</div></div></div><div class="card" style="margin-top:14px"><h3>Server</h3><div class="row"><button class="ok" onclick="game('start')">Bật</button><button onclick="game('restart')">Restart</button><button class="danger" onclick="game('stop')">Tắt</button><button onclick="backup()">Backup DB</button></div></div><div class="card" style="margin-top:14px"><h3>Tạo player</h3><div class="row"><input id="nu" placeholder="username"><input id="np" placeholder="password"><button onclick="createP()">Tạo</button></div></div><div class="card" style="margin-top:14px"><h3>Players</h3><div class="scroll"><table><thead><tr><th>User</th><th>Lv</th><th>Gold</th><th>Exp</th><th>Online</th><th>Thao tác</th></tr></thead><tbody id="players"></tbody></table></div></div><div class="card" style="margin-top:14px"><h3>Logs</h3><div class="log" id="logs"></div></div></main><script>const $=x=>document.querySelector(x);async function api(u,o={}){let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});if(r.status==401){location='/login';return}return r.json()}async function refresh(){let s=await api('/api/status');$('#online').textContent=s.online;$('#lan').textContent=s.lan_ip+':'+s.admin_port;$('#pub').textContent=s.public_ip;$('#game').textContent=(s.game_enabled?'ON':'OFF')+' : '+s.lan_ip+':'+s.game_port;let ps=await api('/api/players');$('#players').innerHTML=ps.map(p=>`<tr><td>${p.username}${p.gm?' 👑':''}${p.banned?' 🚫':''}</td><td>${p.level}</td><td>${p.gold}</td><td>${p.exp}</td><td>${p.online?'🟢':'⚪'}</td><td><button onclick="grant('${p.username}')">+Item/Gold</button> <button onclick="ban('${p.username}',${!p.banned})">${p.banned?'Unban':'Ban'}</button> <button onclick="delp('${p.username}')">Xóa</button></td></tr>`).join('');let ls=await api('/api/logs');$('#logs').textContent=ls.map(x=>`[${x.created_at}] ${x.type} ${x.username}: ${x.message}`).join('\n')}async function grant(u){let g=prompt('Gold?', '100');let item=prompt('Item key (vd wood), bỏ trống nếu không:', '');await api('/api/players/'+u+'/grant',{method:'POST',body:JSON.stringify({gold:+g||0,item:item||''})});refresh()}async function ban(u,b){await api('/api/players/'+u+'/ban',{method:'POST',body:JSON.stringify({banned:b})});refresh()}async function delp(u){if(confirm('Xóa '+u+'?')){await api('/api/players/'+u,{method:'DELETE'});refresh()}}async function createP(){await api('/api/players',{method:'POST',body:JSON.stringify({username:$('#nu').value,password:$('#np').value})});refresh()}async function game(a){await api('/api/game/'+a,{method:'POST'});refresh()}async function backup(){let r=await api('/api/backup',{method:'POST'});alert(r.path||'ok')}async function logout(){await api('/api/logout',{method:'POST'});location='/login'}refresh();setInterval(refresh,4000)</script></body></html>
