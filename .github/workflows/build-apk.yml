name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            for d in \
              "$RUNNER_TOOL_CACHE/android-sdk" \
              "/usr/local/lib/android/sdk" \
              "$HOME/Android/Sdk"
            do
              if [ -d "$d" ]; then
                SDK="$d"
                break
              fi
            done
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK not found"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find "$SDK" -maxdepth 6 -type f 2>/dev/null | grep sdkmanager || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "SDK: $SDK"
          echo "sdkmanager: $SDKMANAGER"

      - name: Install Android packages
        shell: bash
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Validate project
        run: |
          godot --headless \
            --path game-client \
            --editor \
            --quit

      - name: Export APK
        run: |
          mkdir -p game-client/builds

          godot --headless \
            --path game-client \
            --export-debug "Android" \
            builds/game.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yggg-Android
          path: game-client/builds/game.apk
          if-no-files-found: error
